<section class="section" id="blog">
  <div class="container">
    <div class="section-head reveal">
      <span class="eyebrow">Blog & Articles</span>
      <h4>My latest writing</h4>
      <p>Medical notes, technology guides, personal stories and everyday experiences.</p>
    </div>

    <div class="blog-toolbar">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="medical">Medical</button>
      <button class="filter-btn" data-filter="tech">Technology</button>
      <button class="filter-btn" data-filter="education">Education</button>
      <button class="filter-btn" data-filter="personal">Personal</button>
    </div>

    <div class="grid blog-grid" id="blogGrid"></div>
  </div>
</section>

<style>
  .blog-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 1.5rem;
    margin-top: 2.25rem;
  }

  .blog-card {
    background: rgba(255, 255, 255, 0.8);
    border: 1px solid rgba(148, 163, 184, 0.18);
    border-radius: 20px;
    box-shadow: 0 14px 30px rgba(15, 23, 42, 0.06);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    overflow: hidden;
  }

  .blog-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 18px 34px rgba(15, 23, 42, 0.10);
  }

  .blog-card-inner {
    padding: 1.4rem 1.3rem 1.2rem;
  }

  .blog-tag {
    display: inline-block;
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 700;
    color: #0d6efd;
    background: rgba(13, 110, 253, 0.09);
    border-radius: 999px;
    padding: 0.4rem 0.7rem;
    margin-bottom: 0.9rem;
  }

  .blog-card h5 {
    margin: 0 0 0.8rem;
    font-size: clamp(1.1rem, 1.8vw, 1.5rem);
    line-height: 1.3;
    color: #111827;
  }

  .blog-card p {
    margin: 0 0 1rem;
    color: #475569;
    line-height: 1.7;
    font-size: 0.96rem;
  }

  .blog-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    font-size: 0.82rem;
    color: #64748b;
  }

  .blog-meta a {
    color: #0d6efd;
    text-decoration: none;
    font-weight: 600;
  }

  .blog-meta a:hover {
    text-decoration: underline;
  }
</style>

<script>
  const blogPosts = [
    {
      title: "ভিজিটের আগে কী জানা দরকার",
      category: "medical",
      date: "2026-10-01",
      excerpt: "ডাক্তার দেখানোর আগে কিছু গুরুত্বপূর্ণ জিনিস দেখে নেওয়া উচিত, যাতে সময় বাঁচে এবং ভুল কম হয়।",
      link: "#"
    },
    {
      title: "ডিজিটাল স্বাস্থ্য রেকর্ড রাখার সহজ উপায়",
      category: "tech",
      date: "2026-09-20",
      excerpt: "আমাদের মেডিকেল তথ্য নিরাপদে ও সহজে সংরক্ষণ করার জন্য কিছু কার্যকর কৌশল।",
      link: "#"
    },
    {
      title: "পড়াশোনায় ফোকাস ধরে রাখার 5 টিপস",
      category: "education",
      date: "2026-09-10",
      excerpt: "সপ্তাহের ভিড়ে পড়াশোনা ঠিকঠাক রাখতে গেলে কিছু ছোট কিন্তু শক্তিশালী অভ্যাস দরকার।",
      link: "#"
    },
    {
      title: "একটি ছোট শহরের গল্প",
      category: "personal",
      date: "2026-08-28",
      excerpt: "দৈনন্দিন জীবন, স্মৃতি আর ছোট ছোট অভিজ্ঞতার গল্প যা আমাদেরকে আবার ভাবতে শেখায়।",
      link: "#"
    },
    {
      title: "AI কীভাবে ডাক্তারি ও শিক্ষা বদলে দিচ্ছে",
      category: "tech",
      date: "2026-08-15",
      excerpt: "স্বাস্থ্য ও শিক্ষা খাতে AI-র ব্যবহার নিয়ে কিছু চিন্তার খুঁটিনাটি ও সম্ভাবনা।",
      link: "#"
    },
    {
      title: "স্ট্রেস কমানোর কিছু সহজ অভ্যাস",
      category: "medical",
      date: "2026-07-10",
      excerpt: "দৈনন্দিন জীবনে স্ট্রেস নিয়ন্ত্রণের জন্য যে ছোট অভ্যাসগুলো খুব কাজে লাগে।",
      link: "#"
    }
  ];

  const blogGrid = document.getElementById("blogGrid");
  const filterButtons = document.querySelectorAll(".filter-btn");

  function renderPosts(filter = "all") {
    if (!blogGrid) return;

    const filteredPosts = filter === "all"
      ? blogPosts
      : blogPosts.filter((post) => post.category === filter);

    blogGrid.innerHTML = "";

    if (filteredPosts.length === 0) {
      blogGrid.innerHTML = `
        <div style="grid-column: 1 / -1; text-align: center; color: var(--muted, #64748b);">
          No posts found.
        </div>
      `;
      return;
    }

    filteredPosts.forEach((post) => {
      const card = document.createElement("article");
      card.className = "blog-card";
      card.innerHTML = `
        <div class="blog-card-inner">
          <span class="blog-tag">${post.category}</span>
          <h5>${post.title}</h5>
          <p>${post.excerpt}</p>
          <div class="blog-meta">
            <span>${post.date}</span>
            <a href="${post.link}">Read more</a>
          </div>
        </div>
      `;
      blogGrid.appendChild(card);
    });
  }

  filterButtons.forEach((button) => {
    button.addEventListener("click", () => {
      filterButtons.forEach((btn) => btn.classList.remove("active"));
      button.classList.add("active");
      renderPosts(button.dataset.filter);
    });
  });

  renderPosts();
</script>
