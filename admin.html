<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel — Fahim Shahriar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/admin.css" />
  <script src="js/db-client.js"></script>
  <script src="js/admin.js" defer></script>
</head>
<body class="admin-body">
  <!-- Login Screen -->
  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <div class="login-header">
        <img src="https://res.cloudinary.com/ltd7gw9d/image/upload/fahim200KB.png?auto=format&fit=crop&w=80&q=85" alt="Fahim Shahriar" class="login-avatar" />
        <h1>Admin Control Center</h1>
        <p>Fahim Shahriar — Content & Data Management</p>
      </div>
      <form id="loginForm" class="login-form">
        <div class="login-field">
          <label for="loginEmail">Admin Email</label>
          <input type="email" id="loginEmail" placeholder="admin@fahimshahriar.com.bd" required autocomplete="email" />
        </div>
        <div class="login-field">
          <label for="loginPassword">Security Password</label>
          <input type="password" id="loginPassword" placeholder="Enter password" required autocomplete="current-password" />
        </div>
        <div id="loginError" class="login-error" style="display:none;"></div>
        <button type="submit" class="btn btn-primary login-btn" id="loginSubmitBtn">Access Admin Panel →</button>
        <a href="index.html" class="login-back-link">← Back to website</a>
      </form>
    </div>
  </div>

  <!-- Admin Dashboard -->
  <div id="adminDashboard" class="admin-dashboard" style="display:none;">
    <header class="admin-header">
      <div class="admin-header-left">
        <img src="https://res.cloudinary.com/ltd7gw9d/image/upload/fahim200KB.png?auto=format&fit=crop&w=40&q=85" alt="" class="admin-header-avatar" />
        <div>
          <strong>Admin Control Panel</strong>
          <span id="adminUserEmail" class="admin-user-email"></span>
        </div>
      </div>
      <div class="admin-header-right">
        <a href="index.html" class="admin-header-link" target="_blank" rel="noopener">🌐 View Site</a>
        <button class="admin-header-link" id="adminThemeToggle" title="Toggle Dark/Light Mode">☾</button>
        <button class="admin-header-link logout" id="logoutBtn">Logout</button>
      </div>
    </header>

    <button class="admin-sidebar-toggle" id="sidebarToggle" aria-label="Toggle Navigation">☰</button>

    <div class="admin-layout">
      <!-- Sidebar -->
      <nav class="admin-sidebar" id="adminSidebar">
        <div class="admin-sidebar-section-title">CONTENT TABLES</div>
        <button class="admin-nav-btn active" data-table="blog_posts">✍️ Blog Posts</button>
        <button class="admin-nav-btn" data-table="projects">🚀 Projects</button>
        <button class="admin-nav-btn" data-table="services">💼 Services</button>
        <button class="admin-nav-btn" data-table="achievements">🏆 Achievements</button>
        <button class="admin-nav-btn" data-table="testimonials">💬 Testimonials</button>
        <button class="admin-nav-btn" data-table="gallery_photos">🖼️ Gallery</button>
        <button class="admin-nav-btn" data-table="cvs">📄 CVs</button>
        <div class="admin-nav-divider"></div>
        <div class="admin-sidebar-section-title">CLIENT INQUIRIES</div>
        <button class="admin-nav-btn" data-table="messages">✉️ Messages</button>
        <button class="admin-nav-btn" data-table="bookings">📅 Bookings</button>
      </nav>

      <!-- Content Area -->
      <main class="admin-content" id="adminContent">
        <!-- Quick Stats Overview -->
        <div class="admin-stats-grid" id="adminStatsGrid">
          <div class="admin-stat-card" data-table="blog_posts">
            <div class="stat-card-icon">✍️</div>
            <div>
              <div class="stat-card-num" id="statCountBlogs">—</div>
              <div class="stat-card-label">Blog Posts</div>
            </div>
          </div>
          <div class="admin-stat-card" data-table="projects">
            <div class="stat-card-icon">🚀</div>
            <div>
              <div class="stat-card-num" id="statCountProjects">—</div>
              <div class="stat-card-label">Projects</div>
            </div>
          </div>
          <div class="admin-stat-card" data-table="services">
            <div class="stat-card-icon">💼</div>
            <div>
              <div class="stat-card-num" id="statCountServices">—</div>
              <div class="stat-card-label">Services</div>
            </div>
          </div>
          <div class="admin-stat-card" data-table="messages">
            <div class="stat-card-icon">✉️</div>
            <div>
              <div class="stat-card-num" id="statCountMessages">—</div>
              <div class="stat-card-label">Messages</div>
            </div>
          </div>
          <div class="admin-stat-card" data-table="bookings">
            <div class="stat-card-icon">📅</div>
            <div>
              <div class="stat-card-num" id="statCountBookings">—</div>
              <div class="stat-card-label">Bookings</div>
            </div>
          </div>
        </div>

        <div class="admin-content-header">
          <div class="admin-title-wrap">
            <h2 id="adminTableTitle">Blog Posts</h2>
            <span id="adminTableCountBadge" class="admin-count-badge">Loading...</span>
          </div>
          <div class="admin-header-actions">
            <div class="admin-search-wrap">
              <input type="search" id="adminSearchInput" placeholder="Filter rows..." aria-label="Search rows" />
            </div>
            <button class="admin-tool-btn" id="adminRefreshBtn" title="Reload from Database">↻ Refresh</button>
            <button class="btn btn-primary admin-add-btn" id="adminAddBtn">+ Add New</button>
          </div>
        </div>
        <div id="adminTableWrap" class="admin-table-wrap">
          <div class="admin-loading">Loading...</div>
        </div>
      </main>
    </div>
  </div>

  <!-- Edit/Create Modal -->
  <div class="admin-modal" id="adminModal" aria-hidden="true">
    <div class="admin-modal-overlay" id="adminModalOverlay"></div>
    <div class="admin-modal-box">
      <div class="admin-modal-header">
        <h3 id="adminModalTitle">Add New</h3>
        <button class="admin-modal-close" id="adminModalClose">×</button>
      </div>
      <form id="adminForm" class="admin-form">
        <div id="adminFormFields"></div>
        <div class="admin-form-actions" id="adminFormActions">
          <button type="button" class="btn btn-secondary" id="adminCancelBtn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="adminSaveBtn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Mobile sidebar toggle -->
  <button class="admin-sidebar-toggle" id="sidebarToggle">☰ Menu</button>
</body>
</html>
